<style>
/* Same Material 3 tokens as frontend/src/index.css (Google Drive flavour) */
:root {
  --bg:#f8fafd; --surface:#ffffff; --surface-2:#f0f4f9; --surface-3:#e9eef6; --line:#e1e3e1; --outline:#747775;
  --fg:#1f1f1f; --muted:#444746; --subtle:#747775;
  --accent:#0b57d0; --on-accent:#ffffff; --accent-soft:#c2e7ff; --on-accent-soft:#001d35; --accent-container:#d3e3fd;
  --ok:#146c2e; --ok-soft:#c4eed0; --warn:#8a5000; --warn-soft:#ffdf99; --err:#b3261e; --err-soft:#f9dedc;
  --vlm:#6d3fc0; --vlm-soft:#eaddff; --xl:#107c41; --xl-soft:#ddf2e5; --scrim:rgba(0,0,0,.32);
  --shadow-1:0 1px 2px rgba(60,64,67,.3),0 1px 3px 1px rgba(60,64,67,.15);
  --shadow-2:0 1px 2px rgba(60,64,67,.3),0 2px 6px 2px rgba(60,64,67,.15);

  color-scheme:light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg:#1b1b1b; --surface:#131314; --surface-2:#282a2c; --surface-3:#333537; --line:#3c4043; --outline:#8e918f;
  --fg:#e3e3e3; --muted:#c4c7c5; --subtle:#8e918f;
  --accent:#a8c7fa; --on-accent:#062e6f; --accent-soft:#004a77; --on-accent-soft:#c2e7ff; --accent-container:#0842a0;
  --ok:#6dd58c; --ok-soft:#0f5223; --warn:#ffb95c; --warn-soft:#5c3c00; --err:#f2b8b5; --err-soft:#8c1d18;
  --vlm:#d0bcff; --vlm-soft:#4f378b; --xl:#7fd6a2; --xl-soft:#173d28; --scrim:rgba(0,0,0,.6);
  --shadow-1:0 1px 3px rgba(0,0,0,.5); --shadow-2:0 2px 6px 2px rgba(0,0,0,.45); --shadow-3:0 4px 8px 3px rgba(0,0,0,.5);
  color-scheme:dark; } }
:root[data-theme="dark"] {
  --bg:#1b1b1b; --surface:#131314; --surface-2:#282a2c; --surface-3:#333537; --line:#3c4043; --outline:#8e918f;
  --fg:#e3e3e3; --muted:#c4c7c5; --subtle:#8e918f;
  --accent:#a8c7fa; --on-accent:#062e6f; --accent-soft:#004a77; --on-accent-soft:#c2e7ff; --accent-container:#0842a0;
  --ok:#6dd58c; --ok-soft:#0f5223; --warn:#ffb95c; --warn-soft:#5c3c00; --err:#f2b8b5; --err-soft:#8c1d18;

  --shadow-1:0 1px 3px rgba(0,0,0,.5); --shadow-2:0 2px 6px 2px rgba(0,0,0,.45); --shadow-3:0 4px 8px 3px rgba(0,0,0,.5);
  color-scheme:dark; }
html, body { height:100%; }
body { margin:0; background:var(--bg); color:var(--fg); font:14px/20px "Google Sans","Google Sans Text",Roboto,-apple-system,"Segoe UI",Arial,sans-serif; -webkit-font-smoothing:antialiased; }
.material-symbols-rounded { font-family:"Material Symbols Rounded"; font-weight:normal; font-style:normal; line-height:1; display:inline-block; white-space:nowrap; direction:ltr; font-size:24px; font-variation-settings:"FILL" 0,"wght" 400,"GRAD" 0,"opsz" 24; user-select:none; flex:none; -webkit-font-feature-settings:"liga"; font-feature-settings:"liga"; }
.icon-fill { font-variation-settings:"FILL" 1,"wght" 400,"GRAD" 0,"opsz" 24; }
.cite { display:inline-flex; align-items:center; height:20px; padding:0 8px; margin:0 2px; border-radius:10px; background:var(--accent-soft); color:var(--on-accent-soft); font:500 11.5px/20px inherit; border:0; cursor:pointer; vertical-align:1px; }
.gradient-text { background:linear-gradient(74deg,#4285f4 0%,#9b72cb 9%,#d96570 20%,#d96570 24%,#9b72cb 35%,#4285f4 44%,#9b72cb 50%,#d96570 56%,var(--fg) 75%); background-size:400% 100%; -webkit-background-clip:text; background-clip:text; color:transparent; }
/* Excel grid: trường là cột, mỗi giấy tờ một dòng (U47) */
.sheet { border-collapse:separate; border-spacing:0; font-size:13px; }
.sheet th, .sheet td { border-right:1px solid var(--line); border-bottom:1px solid var(--line); padding:0; height:32px; background:var(--surface); }
.sheet thead th { background:var(--surface-2); color:var(--subtle); font-weight:400; font-size:11.5px; text-align:center; position:sticky; top:0; z-index:2; height:24px; }
.sheet .rh { background:var(--surface-2); color:var(--subtle); text-align:center; font-size:11.5px; width:40px; min-width:40px; position:sticky; left:0; z-index:1; }
.sheet thead th.rh { z-index:3; }
.sheet .colA { position:sticky; left:40px; z-index:1; min-width:64px; }
.sheet thead th.colA { z-index:3; }
.sheet td > .c { padding:6px 10px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.sheet td.hd > .c { font-weight:500; background:var(--xl-soft); color:var(--fg); }
.sheet input.cell { width:100%; min-width:120px; height:100%; min-height:31px; border:0; outline:0; background:transparent; color:var(--fg); font:inherit; padding:6px 10px; font-variant-numeric:tabular-nums; }
.sheet td.val:focus-within { outline:2px solid var(--xl); outline-offset:-2px; }
.sheet td.low { background:var(--warn-soft); }
.sheet td.calc { background:var(--vlm-soft); }
.sheet td.edited { background:var(--accent-container); position:relative; }
.sheet td.edited::after { content:""; position:absolute; top:0; right:0; border:5px solid transparent; border-top-color:var(--accent); border-right-color:var(--accent); }
.sheet tr.bstart td { border-top:2px solid var(--outline); }
.sheet tr.sel .rh { background:var(--xl); color:#fff; }
.num { font-variant-numeric:tabular-nums; }
.proto { background:repeating-linear-gradient(135deg,var(--surface-2) 0 10px,var(--surface-3) 10px 20px); }
/* Tách & gom: ảnh thu nhỏ trang */
.thumb { width:58px; height:76px; flex:none; border:1px solid var(--line); border-radius:6px; background:var(--surface); padding:6px 5px; display:flex; flex-direction:column; gap:3px; cursor:pointer; position:relative; }
.thumb i { display:block; height:3px; border-radius:2px; background:color-mix(in srgb, var(--fg) 14%, transparent); }
.thumb b { display:block; height:4px; border-radius:2px; background:color-mix(in srgb, var(--fg) 45%, transparent); }
.thumb span { position:absolute; bottom:2px; right:4px; font-size:10px; color:var(--subtle); }
.thumb.on { outline:2px solid var(--accent); outline-offset:1px; }
.cut { width:18px; flex:none; align-self:center; display:grid; place-items:center; height:76px; border-radius:6px; color:var(--subtle); cursor:pointer; opacity:.35; }
.cut:hover { opacity:1; background:color-mix(in srgb, var(--fg) 8%, transparent); color:var(--fg); }
.cut.mark { opacity:.9; color:var(--warn); }
dialog::backdrop { background:var(--scrim); }
@media (prefers-reduced-motion:reduce) { * { animation:none!important; transition:none!important; } }

<style type="text/tailwindcss">

  --color-accent-container:var(--accent-container); --color-ok:var(--ok); --color-ok-soft:var(--ok-soft); --color-warn:var(--warn); --color-warn-soft:var(--warn-soft);
  --color-err:var(--err); --color-err-soft:var(--err-soft); --color-vlm:var(--vlm); --color-vlm-soft:var(--vlm-soft); --color-xl:var(--xl); --color-xl-soft:var(--xl-soft);

}
@layer components {
  .btn { @apply inline-flex h-10 cursor-pointer items-center justify-center gap-2 rounded-full border border-outline bg-transparent px-5 text-sm font-medium whitespace-nowrap text-accent select-none hover:bg-accent/8 disabled:cursor-default disabled:border-line disabled:text-fg/38 disabled:hover:bg-transparent; }
  .btn-primary { @apply border-transparent bg-accent text-on-accent hover:bg-accent hover:shadow-1 disabled:bg-fg/12 disabled:text-fg/38; }
  .btn-tonal { @apply border-transparent bg-accent-soft text-on-accent-soft hover:bg-accent-soft hover:shadow-1; }
  .btn-text { @apply border-transparent px-3; }
  .btn-danger { @apply text-err hover:bg-err/8; }
  .btn-sm { @apply h-8 gap-1.5 px-3.5 text-[13px]; }
  .btn-icon { @apply inline-flex size-10 flex-none cursor-pointer items-center justify-center rounded-full border-0 bg-transparent text-muted hover:bg-fg/8 disabled:cursor-default disabled:opacity-40 disabled:hover:bg-transparent; }
  .btn-icon.btn-sm { @apply size-8; }
  .input { @apply h-10 min-w-0 rounded-lg border border-outline bg-transparent px-3 text-sm text-fg outline-none placeholder:text-subtle focus:border-2 focus:border-accent focus:px-[11px]; }
  textarea.input { @apply h-auto py-2.5 focus:py-[9px]; }
  .field { @apply flex flex-col gap-1.5 text-xs font-medium text-muted; }
  .badge { @apply inline-flex h-5 items-center gap-1 rounded-md bg-surface-2 px-1.5 text-[11px] font-medium whitespace-nowrap text-muted; }
  .badge-ok { @apply bg-ok-soft text-ok; } .badge-warn { @apply bg-warn-soft text-warn; } .badge-err { @apply bg-err-soft text-err; }
  .badge-info { @apply bg-accent-soft text-on-accent-soft; } .badge-vlm { @apply bg-vlm-soft text-vlm; }
  .chip { @apply inline-flex h-8 cursor-pointer items-center gap-1.5 rounded-lg border border-outline bg-transparent px-3 text-[13px] font-medium whitespace-nowrap text-muted select-none hover:bg-fg/8; }
  .chip-on { @apply border-transparent bg-accent-soft text-on-accent-soft hover:bg-accent-soft; }
  .tag { @apply inline-flex h-6 items-center gap-1 rounded-md bg-surface-2 px-2 text-xs whitespace-nowrap text-muted; }
  .tab { @apply relative h-12 flex-none cursor-pointer px-3 text-sm font-medium whitespace-nowrap text-muted hover:bg-fg/5; }
  .tab-active { @apply text-accent after:absolute after:inset-x-3 after:bottom-0 after:h-[3px] after:rounded-t-full after:bg-accent; }
  .spinner { @apply inline-block size-5 animate-spin rounded-full border-[2.5px] border-accent/25 border-t-accent; }
  .menu-item { @apply flex h-10 w-full cursor-pointer items-center gap-3 px-4 text-left text-sm text-fg hover:bg-fg/8; }
}
</style>

<script>
/* ------------------------------------------------------------ sample data (fictional) */

const LICON = { hop_dong:'article', hoa_don:'receipt_long', bb_ban_giao:'local_shipping', other:'draft' };
const DOC_TITLE = { hop_dong:'HỢP ĐỒNG MUA BÁN', hoa_don:'HOÁ ĐƠN GIÁ TRỊ GIA TĂNG', bb_ban_giao:'BIÊN BẢN BÀN GIAO HÀNG HOÁ', other:'PHIẾU XUẤT KHO' };
const FILES = [

  { n:'HD_045-2026_Minh_Long.pdf', p:5, s:'Hợp đồng mua bán số 045/2026/HĐMB.', reviewed:true },
  { n:'HDon_BB_Minh_Long.pdf', p:4, s:'Hoá đơn và biên bản bàn giao của Minh Long (mới tải lên).', reviewed:false },
];
// dấu điểm cắt do code tìm (§6.9.4): file → trang → lý do
const MARKS = {
  0:{ 1:'Trang 1/4', 5:'đổi khổ A5 ngang', 6:'số hoá đơn đổi, Trang 1/1', 7:'Trang 1/2', 9:'Trang 1/4', 13:'đổi khổ A5 ngang', 14:'Trang 1/1' },

  2:{ 1:'Trang 1/1', 2:'Trang 1/1', 3:'Trang 1/2' },
};
// segment = một giấy tờ; bundle = bộ (§6.9.7). File 2 mới có đề xuất của AI, chưa duyệt.
const SEG0 = [
  { id:'s1', f:0, a:1, b:4, label:'hop_dong', conf:.95, bundle:'B01' },
  { id:'s2', f:0, a:5, b:5, label:'hoa_don', conf:.93, bundle:'B01' },
  { id:'s3', f:0, a:6, b:6, label:'hoa_don', conf:.9, bundle:'B01' },
  { id:'s4', f:0, a:7, b:8, label:'bb_ban_giao', conf:.91, bundle:'B01' },
  { id:'s5', f:0, a:9, b:12, label:'hop_dong', conf:.96, bundle:'B02' },
  { id:'s6', f:0, a:13, b:13, label:'hoa_don', conf:.92, bundle:'B02' },
  { id:'s7', f:0, a:14, b:14, label:'bb_ban_giao', conf:.89, bundle:'B02' },
  { id:'s8', f:1, a:1, b:5, label:'hop_dong', conf:.97, bundle:'B03' },
  { id:'s9', f:2, a:1, b:1, label:'hoa_don', conf:.93, bundle:'B03' },
  { id:'s10', f:2, a:2, b:2, label:'hoa_don', conf:.58, bundle:'B03', truth:'other' },
  { id:'s11', f:2, a:3, b:4, label:'bb_ban_giao', conf:.88, bundle:'B03' },
];
// mẫu bảng: mỗi loại giấy tờ một bảng con, trường là cột (U48)
const TABLES = [
  { label:'hop_dong', title:'Hợp đồng', fields:[['so_hop_dong','Số hợp đồng'],['ngay_ky','Ngày ký'],['ben_ban','Bên bán'],['gia_tri','Giá trị HĐ (đồng)'],['thoi_han_tt','Thời hạn thanh toán']] },
  { label:'hoa_don', title:'Hoá đơn', fields:[['ky_hieu','Ký hiệu'],['so_hoa_don','Số hoá đơn'],['ngay_lap','Ngày lập'],['mst_ban','MST bên bán'],['tien_truoc_thue','Tiền trước thuế'],['thue_gtgt','Thuế GTGT'],['tong_tien','Tổng thanh toán']] },
  { label:'bb_ban_giao', title:'BB bàn giao', fields:[['so_bb','Số biên bản'],['ngay_bg','Ngày bàn giao'],['can_cu_hd','Căn cứ HĐ số'],['hang_hoa','Hàng hoá'],['so_luong','Số lượng']] },
];
const TBL = l => TABLES.find(t => t.label === l);
// giá trị AI theo giấy tờ: chuỗi, hoặc [giá trị, tin cậy, câu gốc, kiểu]
const AI = {
  s1:['012/2026/HĐMB-AP','05/03/2026','Công ty TNHH Điện máy Hoà Bình','660.000.000','30 ngày kể từ ngày nhận hàng'],
  s2:['1C26THB','0001234','12/03/2026','0312345678','500.000.000','50.000.000','550.000.000'],
  s3:['1C26THB','0001240',['20/03/2026',.62,'Ngày 26 tháng 03 năm 2026'],'0312345678','100.000.000','10.000.000','110.000.000'],
  s4:['03/BBBG','15/03/2026','012/2026/HĐMB-AP','Điều hoà Daikin 2HP',['40 bộ',.9,'Lô 1: 20 bộ; Lô 2: 20 bộ','calc']],
  s5:['031/2026/HĐ-AP','28/03/2026','Công ty CP Thiết bị Nam Việt','1.320.000.000','45 ngày'],
  s6:['1K26TNV','0000877','02/04/2026','0108765432','1.200.000.000',['120.000.000',.66,'Tiền thuế GTGT: 12O.000.000'],'1.320.000.000'],
  s7:['07/BB-NV','05/04/2026','031/2026/HĐ-AP','Tủ lạnh Samsung 380L','120 chiếc'],
  s8:['045/2026/HĐMB','10/04/2026','Công ty TNHH Minh Long','385.000.000','Thanh toán 100% sau bàn giao'],
  s9:['1C26TML','0000312','15/04/2026','0109998887','350.000.000','35.000.000','385.000.000'],
  s11:['11/BBBG-ML','18/04/2026','045/2026/HĐMB','Máy giặt LG 9kg','50 chiếc'],
};
const PRESETS = [
  { id:'default', name:'Mặc định', desc:'Agent tra cây hồ sơ, đọc đúng trang rồi trả lời có trích dẫn.' },
  { id:'doi_chieu', name:'Đối chiếu bộ chứng từ thanh toán', desc:'So hợp đồng, hoá đơn, biên bản trong từng bộ: số HĐ, số tiền, ngày, hàng hoá. Do lan.nt soạn · v3.' },
  { id:'ktra_hd', name:'Kiểm tra hoá đơn', desc:'MST, ký hiệu, thuế suất; tổng tiền bằng tiền trước thuế cộng thuế. Do hung.pv soạn · v5.' },
];
const SHEET_TPLS = [
  { id:'tt', name:'Bộ chứng từ thanh toán', tables:['hop_dong','hoa_don','bb_ban_giao'], v:2 },
  { id:'bk_hd', name:'Bảng kê hoá đơn', tables:['hoa_don'], v:1 },
];
const USERS = [
  { name:'Quản trị hệ thống', email:'admin@bank.vn', role:'admin', keys:1, limit:0, spent:96000 },
  { name:'Nguyễn Thị Lan', email:'lan.nt@bank.vn', role:'editor', keys:2, limit:3000000, spent:1184000 },
  { name:'Phạm Văn Hùng', email:'hung.pv@bank.vn', role:'editor', keys:1, limit:3000000, spent:2610000 },
  { name:'Lê Thu Trang', email:'trang.lt@bank.vn', role:'user', keys:1, limit:500000, spent:212000 },
  { name:'Đỗ Quang Huy', email:'huy.dq@bank.vn', role:'user', keys:1, limit:500000, spent:500000 },
];
const ROLE = { admin:'Quản trị', editor:'Được đặt prompt', user:'Người dùng' };
const ME = { admin:USERS[0], editor:USERS[1], user:USERS[3] };

/* ------------------------------------------------------------ helpers */
const fmt = n => n.toLocaleString('vi-VN');
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ic = (n, size=20, cls='', fill=false) => `<span class="material-symbols-rounded ${fill?'icon-fill ':''}${cls}" style="font-size:${size}px" aria-hidden="true">${n}</span>`;
const norm = s => String(s).normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[\s.,]/g,'');
const pdf = (size=18) => ic('picture_as_pdf', size, 'text-[#ea4335]', true);
const canPrompt = () => S.role !== 'user';
const meBudget = () => ME[S.role];
const clone = a => a.map(x => ({...x}));
const col = i => String.fromCharCode(65 + i);
const short = f => FILES[f].n.length > 22 ? FILES[f].n.slice(0, 20) + '…' : FILES[f].n;
const pages = s => s.a === s.b ? `tr. ${s.a}` : `tr. ${s.a}–${s.b}`;
function toast(t) { const el = document.getElementById('toast'); el.textContent = t; el.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => el.hidden = true, 3200); }
function aiCell(segId, key) {
  const orig = SEG0.find(s => s.id === segId), cur = S.segs.find(s => s.id === segId) || orig;
  const t = TBL(cur.label), i = t ? t.fields.findIndex(f => f[0] === key) : -1;
  const raw = orig && orig.label === cur.label && AI[segId] && i >= 0 ? AI[segId][i] : '';
  const [v, conf, quote, kind] = Array.isArray(raw) ? raw : [raw, .95, null, ''];
  return { v, conf: v === '' ? 0 : conf, quote: v === '' ? '' : (quote || `${t.fields[i][1]}: ${v}`), kind: kind || '', page: cur.a + Math.max(i, 0) % (cur.b - cur.a + 1) };
}
const bundleOrder = segs => [...new Set(segs.slice().sort((x,y) => x.bundle.localeCompare(y.bundle)).map(s => s.bundle))];
const sortSegs = segs => segs.slice().sort((x,y) => x.bundle.localeCompare(y.bundle) || x.f - y.f || x.a - y.a);
const reviewedSegs = () => S.segs.filter(s => S.reviewed[s.f]);
const unreviewed = () => FILES.map((f,i) => i).filter(i => !S.reviewed[i]);

/* ------------------------------------------------------------ state */
const S = {
  role:'user', route:'case', mobileCol:'chat',
  preset:'doi_chieu', customPrompt:'', sheetTpl:'tt', cfgTab:'hoa_don',

function cellState(kk) {
  const [id, key] = kk.split('.'), a = aiCell(id, key);
  if (isEdited(kk)) return { cls:'edited', badge:'<span class="badge badge-info">người dùng sửa</span>' };
  if (a.v === '') return { cls:'', badge:'<span class="badge">không tìm thấy</span>' };
  if (a.kind === 'calc') return { cls:'calc', badge:'<span class="badge badge-vlm">agent tính</span>' };
  if (a.conf < .75) return { cls:'low', badge:'<span class="badge badge-warn">cần xem</span>' };
  return { cls:'', badge:'<span class="badge">AI đề xuất</span>' };
}

    <p class="text-sm">Mỗi bảng được chọn là một sheet: dòng 1 là tên trường, cột A là Bộ, mỗi giấy tờ một dòng. File chỉ có dữ liệu, không có cột nguồn, độ tin cậy hay trạng thái.</p>

    </div>
    <p class="text-xs">Kèm một sheet ẩn chứa mã ô để nhập lại bản đã sửa.</p>`,

}

function usageBar(label, spent, limit, reset) {
  const p = limit ? Math.min(100, Math.round(spent / limit * 100)) : 0;
  return `<div class="flex flex-col gap-1.5">
    <div class="flex items-baseline gap-2"><span class="flex-1 text-sm text-fg">${label}</span><span class="text-xs">${limit ? p + '% đã dùng' : ''}</span></div>
    ${limit ? `<div class="h-2 overflow-hidden rounded-full bg-surface-3"><i class="block h-full rounded-full ${p>=90?'bg-err':'bg-accent'}" style="width:${p}%"></i></div>` : ''}
    <div class="flex text-xs"><span class="num flex-1 text-fg">${fmt(spent)} đ${limit ? ' / ' + fmt(limit) + ' đ' : ''}</span><span>${reset}</span></div></div>`;
}

    <div class="overflow-x-auto rounded-xl border border-line"><table class="w-full min-w-[620px] text-[13px]">
      <thead><tr class="bg-surface-2 text-left text-xs"><th class="px-3 py-2 font-medium">Người dùng</th><th class="px-3 py-2 font-medium">Quyền</th><th class="px-3 py-2 font-medium">Đã dùng tháng này</th><th class="px-3 py-2 font-medium">Giới hạn / tháng</th><th class="px-3 py-2 text-right font-medium">Key</th></tr></thead>
      <tbody>${USERS.map((x,i) => { const pp = x.limit ? Math.min(100, Math.round(x.spent/x.limit*100)) : 0; return `

          <td class="num px-3 py-2 text-right">${x.keys}</td></tr>`; }).join('')}</tbody></table></div>
    <p class="text-xs">Quyền <b>Được đặt prompt</b>: viết prompt tuỳ chỉnh, tạo và phát hành mẫu dùng chung, sửa trường của bảng Excel, xem tỷ lệ AI sai theo trường. <b>Người dùng</b>: chọn mẫu có sẵn, hỏi đáp, xuất và sửa Excel.</p>`;

      <div class="flex gap-2"><input class="input flex-1" placeholder="để trống = cùng origin (proxy /v1 của Vite)"><button class="btn btn-text">Kiểm tra</button></div></section>`;

    ${body}`, S.setTab==='users' ? `<button class="btn btn-text" data-act="close">Huỷ</button><button class="btn btn-primary" data-act="saveUsers">Lưu</button>` : closeFooter(), 720);
}

  const row = (a,b) => `<tr class="border-t border-line"><td class="px-3 py-2 align-top text-fg">${a}</td><td class="px-3 py-2 align-top">${b}</td></tr>`;

      ${row('Bảng theo loại (U47, U48)','Mẫu bảng gồm nhiều bảng con, mỗi loại giấy tờ một bảng (Hợp đồng, Hoá đơn, BB bàn giao). <b>Trường là cột</b>, mỗi giấy tờ là một dòng, cột A là <b>Bộ</b>. Chọn bảng ở thẻ Xuất Excel và khi tải .xlsx; mỗi bảng một sheet.')}

      ${row('Mẫu prompt, chi phí (U45, U46)','Như bản 0.16: hộp thoại Cấu hình cuộc trò chuyện; Cài đặt → Key & chi phí.')}

/* ------------------------------------------------------------ render + events */
function render() {
  const view = S.route === 'excel' ? excelView() : S.route === 'split' ? splitView() : caseView();
  document.getElementById('app').innerHTML = shell(view);
  const D = { chatcfg:chatCfgDialog, sheetcfg:sheetCfgDialog, upload:uploadDialog, dl:dlDialog, settings:settingsDialog, notes:notesDialog }[S.dialog];
  const host = document.getElementById('dlg');
  host.innerHTML = D ? D() : '';
  const m = document.getElementById('modal');
  if (m) { m.showModal(); m.addEventListener('cancel', e => { e.preventDefault(); S.dialog = null; S.dlPick = null; render(); }); }
}
function startExport() {
  const tpl = SHEET_TPLS.find(t => t.id === S.sheetTpl), rs = reviewedSegs();
  const tables = tpl.tables.filter(l => S.pick[l] && rs.some(s => s.label === l));
  const nb = bundleOrder(rs).length;
  const ex = { id:'e' + (S.exports.length + 1), name:tpl.name, tpl:'v' + tpl.v, at:'Vừa xong', tables, files:FILES.map((f,i) => i).filter(i => S.reviewed[i]), status:'running', progress:1, nb };
  S.exports.unshift(ex); render(); toast(`Đang tạo ${tables.length} bảng: ô đã duyệt dùng lại, ô thiếu gửi agent mỗi bộ một lượt`);
  const tick = setInterval(() => { ex.progress++; if (ex.progress > nb) { clearInterval(tick); ex.status = 'done'; toast('Bảng đã xong. Bấm để mở.'); } render(); }, 900);
}
function confirmSplit() {
  const map = Object.fromEntries(bundleOrder(S.draft).map((b,i) => [b, 'B' + String(i + 1).padStart(2, '0')]));
  S.draft.forEach(s => s.bundle = map[s.bundle]);
  S.segs = S.draft; S.draft = null; S.reviewed = FILES.map(() => true); S.route = 'case';
  toast(`Đã xác nhận: ${S.segs.filter(s => s.label !== 'other').length} giấy tờ trong ${Object.keys(map).length} bộ`);
}
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]'); if (!t) return;
  const v = t.dataset.v;
  switch (t.dataset.act) {
    case 'role': S.role = v; break;
    case 'notes': S.dialog = 'notes'; break;
    case 'settings': S.dialog = 'settings'; if (t.dataset.tab) S.setTab = t.dataset.tab; break;
    case 'stTab': S.setTab = v; break;
    case 'close': S.dialog = null; S.dlPick = null; break;
    case 'mcol': S.mobileCol = v; break;
    case 'chatcfg': S.dialog = 'chatcfg'; break;
    case 'saveChatCfg': { const r = document.querySelector('input[name=preset]:checked'); if (r) S.preset = r.value; const ta = document.getElementById('customPrompt'); if (ta) S.customPrompt = ta.value; S.dialog = null; toast(document.getElementById('shareTpl')?.checked ? 'Đã lưu và gửi thành mẫu dùng chung (bản nháp)' : 'Đã lưu cấu hình cuộc trò chuyện'); break; }
    case 'sheetcfg': S.dialog = 'sheetcfg'; break;
    case 'cfgTab': S.cfgTab = v; break;
    case 'saveSheetCfg': { const r = document.querySelector('input[name=sheetTpl]:checked'); if (r) S.sheetTpl = r.value; S.dialog = null; break; }
    case 'export': startExport(); return;
    case 'openx': S.openExport = v; S.route = 'excel'; S.sel = null; break;
    case 'back': if (S.route === 'excel' && unsaved()) toast('Còn chỉnh sửa chưa lưu, chúng vẫn được giữ trong bản nháp'); S.route = 'case'; S.draft = null; break;
    case 'stab': S.table = v; S.sel = null; break;
    case 'panel': S.panel = v || null; break;
    case 'undo': { const [id, key] = v.split('.'); S.values[v] = aiCell(id, key).v; S.fromFile.delete(v); break; }
    case 'upload': S.dialog = 'upload'; break;
    case 'doUpload': S.values['s3.ngay_lap'] = '26/03/2026'; S.values['s1.thoi_han_tt'] = '30 ngày kể từ ngày nhận đủ hàng'; S.fromFile.add('s3.ngay_lap'); S.fromFile.add('s1.thoi_han_tt'); S.dialog = null; S.panel = 'edits'; toast('Đã đọc file: 2 ô khác giá trị AI, 1 dòng thêm tay bị bỏ qua'); break;
    case 'dl': S.dialog = 'dl'; break;
    case 'doDl': { const ex = curEx(); toast(`Tải .xlsx: ${ex.tables.filter(l => S.dlPick[l]).map(l => TBL(l).title).join(', ')} + sheet ẩn mã ô`); S.dialog = null; S.dlPick = null; break; }
    case 'save': { const n = edits().length; S.saved = {...S.values}; toast(`Đã lưu ${n} chỉnh sửa và ghi nhận ${n} lỗi AI cho mẫu theo bảng và trường`); break; }
    case 'issue': S.issued = 'sk-bepaylot-' + Math.random().toString(36).slice(2, 10) + Math.random().toString(36).slice(2, 10); break;
    case 'saveUsers': S.dialog = null; toast('Đã lưu quyền và hạn mức'); break;
    case 'split': {
      S.draft = clone(S.segs); S.route = 'split';
      const un = unreviewed(); S.spFile = un.length ? un[0] : 0;
      const low = S.draft.filter(s => s.f === S.spFile).sort((a,b) => a.conf - b.conf)[0];
      S.spSel = { f:S.spFile, p:low ? low.a : 1 }; break;
    }
    case 'spfile': S.spFile = +v; S.spSel = { f:+v, p:1 }; break;
    case 'thumb': { const [f, p] = v.split(':').map(Number); S.spSel = { f, p }; S.spFile = f; break; }
    case 'cut': {
      const [id, p] = v.split(':'), i = S.draft.findIndex(s => s.id === id), s = S.draft[i];
      S.draft.splice(i + 1, 0, { id:'n' + Date.now(), f:s.f, a:+p, b:s.b, label:s.label, conf:1, bundle:s.bundle }); s.b = +p - 1; s.conf = 1; break;
    }
    case 'merge': {
      const s = S.draft.find(x => x.id === v), prev = S.draft.find(x => x.f === s.f && x.b === s.a - 1);
      prev.b = s.b; prev.conf = 1; S.draft = S.draft.filter(x => x !== s); break;
    }
    case 'rerun': toast(`AI đề xuất lại cho ${FILES[S.spFile].n}: 1 lần gọi, chỉ đọc tiêu đề và dấu điểm cắt`); return;
    case 'confirmSplit': confirmSplit(); break;
    default: return;
  }
  render();
});
document.addEventListener('change', e => {
  const d = e.target.dataset || {};
  if (d.cell !== undefined) { S.values[d.cell] = e.target.value; S.fromFile.delete(d.cell); S.sel = { kk:d.cell, label:d.label }; render(); }
  else if (d.pick) { S.pick[d.pick] = e.target.checked; render(); }
  else if (d.dl) { S.dlPick[d.dl] = e.target.checked; render(); }
  else if (d.slabel) { const s = S.draft.find(x => x.id === d.slabel); s.label = e.target.value; s.conf = 1; render(); }
  else if (d.smove) {
    const s = S.draft.find(x => x.id === d.smove);
    if (e.target.value === 'new') { const max = Math.max(...S.draft.map(x => +x.bundle.slice(1))); s.bundle = 'B' + String(max + 1).padStart(2, '0'); }
    else s.bundle = e.target.value;
    render();
  }
});
document.addEventListener('focusin', e => {
  const c = e.target.dataset && e.target.dataset.cell;
  if (c === undefined || (S.sel && S.sel.kk === c)) return;
  S.sel = { kk:c, label:e.target.dataset.label };
  const pos = e.target.selectionStart;
  render();
  const el = document.querySelector(`[data-cell="${c}"]`); if (el) { el.focus(); try { el.setSelectionRange(pos, pos); } catch {} }
});
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.dataset && e.target.dataset.cell !== undefined) e.target.blur(); });
render();
</script>
