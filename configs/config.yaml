# bepaylot configuration. Values of the form ${VAR} are expanded from the
# environment at load time. A few well-known env vars also override entries
# directly: DATABASE_URL, ANTHROPIC_API_KEY, OPENAI_API_KEY,
# BEPAYLOT_DEFAULT_PROVIDER, BEPAYLOT_HTTP_ADDR.

env: ${BEPAYLOT_ENV}

http:
  addr: ${BEPAYLOT_HTTP_ADDR}
  read_timeout: 65s
  write_timeout: 0s          # keep 0 for SSE
  shutdown_timeout: 20s
  cors_origins: []           # empty = allow any origin
  # DEV ONLY: skips authentication entirely when true. Never enable
  # this in a deployed environment.
  auth_bypass: ${BEPAYLOT_AUTH_BYPASS}   # empty/false = auth required (default)
  # Users allowed to call /v1/admin/* (queues, dead letters). Set with
  # BEPAYLOT_ADMIN_EMAILS=a@x.vn,b@x.vn; empty = admin API disabled (403).
  admin_emails: []

# Sign-in for the web UI, like WeKnora: email + password (register/login on
# /login) and optional OIDC. Both issue a JWT access token (Authorization:
# Bearer) and a single-use refresh token; issued tokens are recorded so logout
# and password changes revoke them. API keys (x-api-key) keep working for
# scripts — create them in the UI (Tài khoản → API key) instead of make seed.
auth:
  jwt_secret: ${BEPAYLOT_JWT_SECRET}      # empty = generated once, kept in the DB (app_secrets)
  access_ttl: 24h
  refresh_ttl: 168h
  registration: ${BEPAYLOT_REGISTRATION}  # open (default) | closed
  password_min_length: 8
  oidc:
    enabled: ${BEPAYLOT_OIDC_ENABLED}     # empty/false = no OIDC button
    provider: oidc                        # stored on users created through OIDC
    display_name: ${BEPAYLOT_OIDC_DISPLAY_NAME}   # button label, e.g. Keycloak; default SSO
    issuer_url: ${BEPAYLOT_OIDC_ISSUER_URL}       # e.g. https://sso.example.com/realms/main
    client_id: ${BEPAYLOT_OIDC_CLIENT_ID}
    client_secret: ${BEPAYLOT_OIDC_CLIENT_SECRET}
    # scopes default to [openid, email, profile]; BEPAYLOT_OIDC_SCOPES overrides (comma separated)
    # Callback registered at the provider; empty = <request origin>/v1/auth/oidc/callback
    # (in dev through Vite: http://localhost:5174/v1/auth/oidc/callback).
    redirect_url: ${BEPAYLOT_OIDC_REDIRECT_URL}
    # Where the browser lands after the callback; empty = /login on the same origin.
    frontend_url: ${BEPAYLOT_OIDC_FRONTEND_URL}

db:
  dsn: ${DATABASE_URL}
  max_conns: 10
  min_conns: 1
  max_conn_lifetime: 1h
  auto_migrate: true

llm:
  default_provider: ${BEPAYLOT_DEFAULT_PROVIDER}
  default_model: ${BEPAYLOT_DEFAULT_MODEL}
  summary_model: ${BEPAYLOT_DEFAULT_MODEL}
  # Per-reply output cap. A reply cut off by it is continued automatically (up to
  # 4 times), but every continuation re-sends the conversation, so a cap that fits
  # typical long answers is cheaper than relying on that.
  max_tokens: 16000
  # Default sampling temperature when a request sets none. Leave unset for the
  # provider's default; use 0-0.3 where the same request should give the same
  # answer on every run.
  # temperature: 0.2
  request_timeout: 5m
  providers:
    claude:
      kind: claude
      api_key: ${ANTHROPIC_API_KEY}
      base_url: ${ANTHROPIC_BASE_URL}
    openai:
      kind: openai
      # api_key is optional for local OpenAI-compatible servers (LM Studio,
      # llama.cpp, vLLM, Ollama). base_url may be the API base
      # (http://127.0.0.1:1234/v1) or a full endpoint URL — the
      # /chat/completions suffix is trimmed automatically.
      api_key: ${OPENAI_API_KEY}
      base_url: ${OPENAI_BASE_URL}
    # Deterministic, network-free provider for local development and tests.
    fake:
      kind: fake

embedding:
  # 'hash' is deterministic and needs no API key. Switch to 'openai' for real
  # semantic retrieval (keep dim consistent with the migration: 1536).
  kind: ${BEPAYLOT_EMBEDDING_KIND}
  model: text-embedding-3-small
  api_key: ${OPENAI_API_KEY}
  base_url: ${OPENAI_BASE_URL}
  dim: 1536

agent:
  identity: >-
    You are bepaylot, a helpful, precise AI assistant. You give direct,
    well-structured answers, use tools and skills when they materially improve
    the result, and you never fabricate facts or tool output.
  response_style: >-
    Prefer concise, skimmable answers in Markdown. Lead with the answer, then
    supporting detail. Match the user's language.
  # Most times one turn may call the model (each tool round is one call). On the
  # last call the model gets no tools and must answer, so a turn that runs out
  # of budget still ends with a reply instead of an error.
  max_steps: 16
  history_token_budget: 24000
  summarize_every_n: 8
  skill_top_k: 4
  ping_interval: 15s

skills:
  dir: ${BEPAYLOT_SKILLS_DIR}
  sync_on_startup: true

tools:
  http_allowlist: []          # empty = any public host

mcp:
  # Model Context Protocol servers. Both sources below are hot-reloadable — a
  # server can be attached or detached while the process runs, and its tools
  # appear on the next message with no restart.
  enabled: ${BEPAYLOT_MCP_ENABLED}   # empty/false = MCP off, API returns 503
  # Static server list. Edit this file while running: changes are reconciled
  # within reload_interval. Leave file blank to use the API only.
  file: configs/mcp.yaml
  reload_interval: 10s              # 0 = load once at startup, never re-read
  init_timeout: 20s                 # per-server connect + handshake budget
  tool_prefix: "mcp__"             # tools import as <prefix><server>__<tool>

log:
  level: ${BEPAYLOT_LOG_LEVEL}
  format: ${BEPAYLOT_LOG_FORMAT}

# ---------------------------------------------------------------------------
# Document processing (spec/spec.md §4–§11)
# ---------------------------------------------------------------------------

# Broker for the asynq task queue. Empty = run tasks in-process (development,
# single instance only).
redis:
  addr: ${REDIS_ADDR}
  password: ${REDIS_PASSWORD}
  db: 0

# Original files, rendered page images and raw parser output live in S3;
# Postgres only stores object keys. Empty bucket = in-memory store
# (development only).
storage:
  s3:
    endpoint: ${S3_ENDPOINT}
    region: ${S3_REGION}
    bucket: ${S3_BUCKET}
    prefix: bepaylot
    access_key: ${S3_ACCESS_KEY}
    secret_key: ${S3_SECRET_KEY}
    use_path_style: true            # MinIO
    create_bucket: true             # create the bucket when missing (dev)
    part_size_mb: 16
    upload_concurrency: 4
  presign: true
  presign_ttl: 15m

upload:
  max_bytes: 524288000              # 500 MB per file
  max_files: 100                    # per request
  allowed_types: [application/pdf, image/jpeg, image/png, image/tiff]

# Optional completion callback: POST /v1/kbs/{id}/documents with form field
# callback_url; when a document reaches completed | partial | failed |
# cancelled, a JSON POST is sent there (spec §4.7).
callback:
  timeout: 10s                      # per attempt
  max_attempts: 8
  backoff: [10s, 30s, 1m, 5m, 15m, 30m, 1h]   # wait before attempt 2, 3, …; last repeats
  signing_secret: ${BEPAYLOT_CALLBACK_SECRET} # empty = unsigned
  allow_private_networks: ${BEPAYLOT_CALLBACK_ALLOW_PRIVATE}   # true only in dev (localhost callbacks)

workers:
  role: ${BEPAYLOT_ROLE}             # api | worker | all (default all)
  concurrency: { core: 4, ocr: 8, index: 6, wiki: 8, maintenance: 2 }   # render = parser.render.workers
  render_inflight_batches: 1        # per document
  render_ahead_pages: 32            # rendered pages waiting for OCR, per document
  ocr_inflight_pages: 8             # per document
  housekeeping_interval: 5m

parser:
  default_engine: ${BEPAYLOT_OCR_ENGINE}   # turboocr (default) | turboocr_vlm
  pdf_mode: ocr_all                 # ocr_all | auto
  render:
    mode: ${BEPAYLOT_RENDER_MODE}    # multi_threaded (prod, needs libpdfium) | webassembly (default)
    worker_bin: ${BEPAYLOT_PDFIUM_WORKER}
    workers: 0                      # 0 = min(NumCPU-1, 4)
    dpi: 300
    max_long_side: 4000
    max_pixels: 16000000
    jpeg_quality: 85
    batch_pages: 8
    page_timeout: 30s
    recycle_after_pages: 500
    max_worker_rss_mb: 1024
    cache_dir: data/cache/pdf
    cache_max_bytes: 21474836480    # 20 GB
  text_layer:
    enabled: all                    # all | pdfa_only | off
    min_chars: 20
    max_bad_char_ratio: 0.02
    merge_min_similarity: 0.6
  reading_order_fix: true
  low_conf_threshold: 0.6
  furniture_repeat_ratio: 0.5
  class_map: {}
  engines:
    turboocr:
      base_url: ${TURBOOCR_URL}     # e.g. http://10.215.122.20:30189
      timeout: 120s
      options: { layout: true, reading_order: true, tables: true, formulas: false }
      breaker: { failures: 5, open_for: 30s }
    # turboocr_vlm: TurboOCR layout → crop each region → VLM transcribes the
    # crops concurrently → text aligned back to OCR lines per page (§5.9).
    # Registered when base_url is set; pick it with default_engine or the
    # per-upload `engine` field.
    vlm:
      base_url: ${VLM_BASE_URL}     # e.g. http://localhost:1234/v1 (LM Studio), http://vllm:8000/v1
      api_key: ${VLM_API_KEY}
      model: allenai/olmocr-2-7b
      max_tokens: 4096
      temperature: 0.1
      timeout: 180s
      max_concurrency: 4            # in-flight VLM requests per worker process
      classes: []                   # [] = text-like classes (text, titles, table, formula, header/footer…)
      padding: 12
      max_side: 1288                # olmOCR is trained on 1288 px pages
      jpeg_quality: 90
      retries: 1
      on_error: fallback            # fallback = keep OCR text for that region | fail = retry the page
      full_page: true               # no layout region → send the whole page
      min_coverage: 0.3             # share of OCR words that must agree with the VLM text
      skip_with_text_layer: true    # PDF/A pages with a good text layer skip the VLM

index:
  section: { max_tokens: 1500 }
  tree:
    llm: true                       # false = extractive summaries, no LLM
    flat_max_pages: 5
    summary_words: 60
    card_summary_words: 120
    provider: ""                    # "" = llm.default_provider
    model: ""                       # "" = llm.default_model

search:
  provider: ""
  model: ""                         # a fast model is recommended
  default_mode: reasoning           # reasoning | keyword | metadata
  map_token_budget: 12000           # multi-case (kb_ids) index above this → pick cases first
  max_wiki_pages: 4                 # wiki pages read at step 3 (§6.10)
  node_read_budget: 6000            # smaller tree branches are read without walking
  max_docs_selected: 5              # files read from source per request
  parallel_docs: 4
  tree_token_budget: 8000
  full_doc_token_budget: 12000
  page_token_budget: 24000
  max_hops: 3
  max_llm_calls: 12
  quote_min_similarity: 0.8
  cache_ttl: 10m
  timeout: 60s

# Cases (§6.2): one YAML file per case type (code pattern/normalization,
# metadata schemas, parser engine, wiki on/off and schema).
cases:
  types_dir: configs/case_types
  default_type: default             # used when upload/create names no case_type
  auto_create_on_upload: true       # false = create cases first (POST /kbs/:id/cases)

# LLM Wiki of each case (§6.6–6.9), stored in Postgres.
wiki:
  enabled_by_default: true          # case types can turn it off with wiki.enabled: false
  schemas_dir: configs/wiki_schemas
  default_schema: generic
  provider: ""                      # "" = llm.default_provider
  model: ""                         # "" = llm.default_model; extracts entities and relations (JSON only)
  strict_citations: false           # true = refuse hand edits with invalid footnotes (422)
  index: { max_tokens: 6000 }
  # Ingest: the LLM only extracts (1 call per file, 1 per part of a big file);
  # every page is written by code from the index tree and the extraction.
  ingest:
    extract: true                   # false = source pages + overview only, 0 LLM calls
    doc_token_budget: 24000         # bigger files are extracted part by part (top branches of the tree)
    parallel: 2                     # parts extracted at the same time
    max_llm_calls: 8                # per file; above it the file is "partial"
    max_entities: 40                # per file
    name_similarity: 0.85           # trigram threshold for entity names without identity
  lint: { interval: 24h, llm: false }
