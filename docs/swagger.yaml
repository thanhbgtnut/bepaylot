        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Read a wiki page, or its history with …/{slug}/revisions
      tags:
      - Wiki
    post:
      consumes:
      - application/json
      parameters:
      - description: Case id
        format: uuid
        in: path
        name: id
        required: true
        type: string
      - description: Page slug followed by /proposal or /revisions/{v}/restore
        in: path
        name: slug
        required: true
        type: string
      - description: 'For /proposal: {\'
        in: body
        name: request
        schema:
          $ref: '#/definitions/dto.WikiProposalRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
