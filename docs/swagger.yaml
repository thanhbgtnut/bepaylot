      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.CorrectionStats'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - ApiKeyAuth: []
