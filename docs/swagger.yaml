          schema:
            $ref: '#/definitions/wiki.EditResult'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Edit a wiki page by hand (title, content, attributes, footnotes)
      tags:
      - Wiki
