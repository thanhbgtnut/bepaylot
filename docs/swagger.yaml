    get:
      parameters:
      - description: Case id
        format: uuid
        in: path
        name: id
        required: true
        type: string
      - description: Comma-separated statuses
        in: query
        name: status
        type: string
      - description: Upload batch id
        in: query
        name: batch_id
        type: string
      - description: JSON metadata filter, e.g. {\
        in: query
        name: metadata
        type: string
      - description: Full-text over file name, card and metadata values
        in: query
        name: q
        type: string
      - default: 100
        description: Page size (max 500)
        in: query
        name: limit
        type: integer
      - description: 'Cursor: created_at of the last item (RFC3339)'
        in: query
        name: before
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.DocumentList'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: List the documents of a case
      tags:
      - Cases
    post:
      consumes:
      - multipart/form-data
      description: Same fields as POST /v1/kbs/{id}/documents, without case_code.
      parameters:
      - description: Case id
        format: uuid
        in: path
        name: id
        required: true
        type: string
      - description: File (repeat for several files)
        in: formData
        name: file
        required: true
        type: file
      - description: JSON metadata for every file
        in: formData
        name: metadata
        type: string
      - description: JSON per-file metadata keyed by file name or index
        in: formData
        name: files_metadata
        type: string
      - description: Optional URL that receives a POST (JSON) when each document finishes
        in: formData
        name: callback_url
        type: string
      - description: Use the high-priority lanes (chat attachments)
        in: query
        name: interactive
        type: boolean
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/document.UploadResult'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Upload one or more files (streamed) into a case
      tags:
      - Cases
