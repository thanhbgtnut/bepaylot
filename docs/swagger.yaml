        items:
          $ref: '#/definitions/types.Case'
        type: array
      next_cursor:
        type: string
    type: object
  dto.CaseRef:
    properties:
      code:
        type: string
      kb_id:
        type: string
    type: object
  dto.CaseTypeList:
    properties:
      data:
        items:
          $ref: '#/definitions/types.CaseType'
        type: array
    type: object
  dto.CreateKBRequest:
    properties:
      config:
        $ref: '#/definitions/types.KBConfig'
      description:
        type: string
      metadata_schema:
        $ref: '#/definitions/types.MetadataSchema'
      name:
        type: string
    type: object
  dto.CreateSessionRequest:
    properties:
      case:
        allOf:
        - $ref: '#/definitions/dto.CaseRef'
        description: Case names the case by knowledge base and code instead of CaseID.
      case_id:
        description: CaseID binds the new session to a case for its whole life (§8.1).
        type: string
      metadata:
        additionalProperties: {}
        type: object
      model:
        type: string
      provider:
        type: string
      system:
        type: string
      title:
        type: string
    type: object
  dto.DeadLetter:
    properties:
      fail_count:
        type: integer
      failed_at:
        type: string
      id:
        type: integer
      last_error:
        type: string
      payload:
        type: object
      queue:
        type: string
      scope:
        type: string
      scope_id:
        type: string
      task_type:
        type: string
    type: object
  dto.DeadLetterList:
    properties:
      data:
        items:
          $ref: '#/definitions/dto.DeadLetter'
        type: array
    type: object
  dto.DeleteResponse:
    properties:
      deleted:
        type: boolean
      id:
        type: string
    type: object
  dto.DocumentList:
    properties:
      data:
        items:
          $ref: '#/definitions/types.Document'
