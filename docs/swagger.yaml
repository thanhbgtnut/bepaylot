        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Delete a document (async purge of rows and objects)
      tags:
      - Documents
    get:
      parameters:
      - description: Document id
        format: uuid
        in: path
        name: id
        required: true
        type: string
      - description: Include processing spans
        in: query
        name: spans
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/document.DocumentDetail'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Get a document with progress, failed pages and (optionally) spans
      tags:
      - Documents
