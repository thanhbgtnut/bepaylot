        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Accept/reject an ingest proposal (…/{slug}/proposal) or restore a revision
        (…/{slug}/revisions/{v}/restore)
      tags:
      - Wiki
    put:
      consumes:
      - application/json
      description: 'footnotes maps a footnote number to a citation id of this case
        (doc:<id>:p<page>:l<a>-<b>); each is checked against the source lines. Invalid
        footnotes are marked stale (or refused with 422 when wiki.strict_citations).
        An edited page is not overwritten by ingest: later ingests leave a proposal.'
