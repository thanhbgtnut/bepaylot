      provider:
        type: string
      summary:
        type: string
      title:
        type: string
      updated_at:
        type: string
    type: object
  dto.SessionDetail:
    properties:
      case_id:
        type: string
      created_at:
        type: string
      id:
        type: string
      messages:
        items:
          $ref: '#/definitions/dto.TranscriptMessage'
