        type: string
    type: object
  dto.DocumentSearchResponse:
    properties:
      pages:
        items:
          $ref: '#/definitions/types.PageSearchHit'
        type: array
    type: object
  dto.EngineInfo:
    properties:
      available:
        type: boolean
      default:
        type: boolean
      error:
        type: string
      name:
        type: string
    type: object
  dto.EngineList:
    properties:
      data:
        items:
          $ref: '#/definitions/dto.EngineInfo'
        type: array
    type: object
  dto.ErrorResponse:
    properties:
      error:
        properties:
          message:
            type: string
          type:
            type: string
        type: object
      type:
        description: '"error"'
        type: string
    type: object
  dto.HealthResponse:
    properties:
      status:
        example: ok
        type: string
    type: object
  dto.InputMessage:
    properties:
