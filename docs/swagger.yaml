info:
  contact: {}
  description: A streaming AI agent backend with document processing. `/v1/messages`
    mirrors the Anthropic Messages API (with additive `provider` and `metadata.session_id`
    / `metadata.kb_ids` fields); `/v1/sessions` manages conversations; `/v1/kbs`,
    `/v1/documents` and `/v1/search` parse files (OCR + PDF text layer) and search
    them without embeddings; `/v1/graph` and `/v1/kbs/{id}/wiki` expose the extracted
    knowledge graph.
  title: bepaylot API
  version: 1.0.0
paths:
  /healthz:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.HealthResponse'
      summary: Liveness probe
      tags:
      - Health
  /readyz:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.ReadyResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/dto.ReadyResponse'
      summary: Readiness probe (checks the database)
      tags:
      - Health
  /v1/admin/dead-letters:
    get:
      parameters:
      - description: Filter by task type
        in: query
        name: task_type
        type: string
      - description: Filter by scope id (document/KB id)
        in: query
        name: scope_id
        type: string
      - default: 100
        description: Max rows
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.DeadLetterList'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Tasks that exhausted their retries
      tags:
      - Admin
  /v1/admin/dead-letters/{id}/retry:
    post:
      parameters:
      - description: Dead letter id
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.OK'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Re-enqueue a dead-lettered task
      tags:
      - Admin
  /v1/admin/queues:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.QueueStats'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Queue depths per worker pool
      tags:
      - Admin
  /v1/ag-ui/run:
    post:
      consumes:
      - application/json
      description: |-
        Accepts an AG-UI `RunAgentInput` and streams the turn back as AG-UI protocol Server-Sent Events: `RUN_STARTED`, `TEXT_MESSAGE_START` / `TEXT_MESSAGE_CONTENT` / `TEXT_MESSAGE_END`, `TOOL_CALL_START` / `TOOL_CALL_ARGS` / `TOOL_CALL_END` / `TOOL_CALL_RESULT`, then `RUN_FINISHED` (or `RUN_ERROR`). Each frame is a `data:` line whose JSON carries a `type` field.
        `threadId` maps to a bepaylot session: pass an existing session id to continue a conversation, or leave it empty to start a new one (the new id is returned in `RUN_STARTED.threadId` — persist it for the next turn). Only the last user message drives the turn; history is loaded server-side. `state` and `context` are folded into the system prompt for this turn. `tools` are bound as client-executed tools: the agent may call one, but bepaylot only emits the `TOOL_CALL_*` frames and ends the run — the client must execute the tool and send the result back as a `tool` message on the next run. `forwardedProps` is accepted but has no defined effect. A request whose `messages` carries no user turn is treated as a history replay for an existing `threadId` (CopilotKit issues this when a thread becomes the active one in the UI): the response is `RUN_STARTED` + `MESSAGES_SNAPSHOT` (the session's persisted messages) + `RUN_FINISHED`, with no new turn run or saved. Such a request naming an empty or unknown `threadId` is a 400, since there is nothing to replay.
        A thread runs one turn at a time, but a message never has to wait for it. If a run is already in progress on the thread, the new message is handed to it — the model reads it before its next step — and this request answers immediately with an empty `RUN_STARTED` + `RUN_FINISHED`; the reply appears on the stream of the run that is in progress. A short stop message ("stop", "dừng", "hủy") interrupts the run in progress instead: it keeps what it produced and ends with a normal `RUN_FINISHED`, and the message then runs as a normal turn.
      parameters:
      - description: AG-UI RunAgentInput
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.AGUIRunAgentInput'
      produces:
      - text/event-stream
      responses:
        "200":
          description: AG-UI protocol SSE event stream
          schema:
            type: string
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Run an agent turn (AG-UI protocol)
      tags:
      - AG-UI
  /v1/citations:
    get:
      parameters:
      - description: Citation id
        in: query
        name: id
        required: true
        type: string
      produces:
