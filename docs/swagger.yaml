      - ApiKeyAuth: []
      summary: The split of a case into documents and bundles (§6.9.7)
      tags:
      - Split
    put:
      consumes:
      - application/json
      description: The bundles in order, each with its documents. Every page of each
        file in the request must be in exactly one document; the documents become
        the user's segments and only they become rows of sheets.
      parameters:
      - description: Case id
        format: uuid
        in: path
        name: id
        required: true
        type: string
      - description: Bundles
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/docmodel.SplitInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/docmodel.SplitView'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Confirm the split of a case (§6.9.7)
      tags:
      - Split
