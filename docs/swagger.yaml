        type. body and fields are returned to prompt editors only; they also see drafts
        with drafts=1.
      parameters:
      - description: chat | sheet
        in: query
        name: kind
        type: string
      - description: Only templates usable for this case type
        in: query
        name: case_type
        type: string
      - description: Include drafts (prompt editors)
        in: query
        name: drafts
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.TemplateList'
      security:
      - ApiKeyAuth: []
      summary: Prompt templates (§8.4)
      tags:
      - Templates
    post:
      consumes:
      - application/json
      parameters:
      - description: Template
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.TemplateRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/types.PromptTemplate'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Create a template (draft, version 1)
      tags:
      - Templates
  /v1/templates/{id}:
    get:
      parameters:
      - description: Template id
        format: uuid
        in: path
        name: id
        required: true
        type: string
      - description: 'Version (default: published, else latest)'
        in: query
        name: version
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/types.PromptTemplate'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: One template at a version (prompt editors)
      tags:
      - Templates
