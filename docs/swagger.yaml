      tags:
      - Templates
  /v1/templates/{id}/publish:
    post:
      consumes:
      - application/json
      parameters:
      - description: Template id
        format: uuid
        in: path
        name: id
        required: true
        type: string
      - description: Version
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.PublishTemplateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/types.PromptTemplate'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Publish a version
      tags:
      - Templates
  /v1/templates/{id}/versions:
    post:
      consumes:
      - application/json
      parameters:
      - description: Template id
        format: uuid
        in: path
        name: id
        required: true
        type: string
      - description: Body and fields (name/description optional)
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.TemplateRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/types.PromptTemplate'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Save a new (draft) version; the published one keeps running
      tags:
      - Templates
schemes:
- http
- https
securityDefinitions:
  ApiKeyAuth:
    description: 'An API key (created in the web UI under Tài khoản → API key, via
      POST /v1/auth/api-keys, or by `cmd/seed`). Alternatively send `Authorization:
      Bearer <access token>` from POST /v1/auth/login; an API key is also accepted
      as the Bearer value.'
    in: header
    name: x-api-key
    type: apiKey
swagger: "2.0"
