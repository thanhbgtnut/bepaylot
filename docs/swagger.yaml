      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.LocationsResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Resolve a citation id (doc:<id>:p<page>:l<a>-<b>) to text and boxes
      tags:
      - Search
  /v1/documents/{id}:
    delete:
      parameters:
      - description: Document id
        format: uuid
        in: path
        name: id
        required: true
