basePath: /
definitions:
  cases.CreateRequest:
    properties:
      case_type:
        type: string
      code:
        type: string
      metadata:
        additionalProperties: {}
        type: object
      title:
        type: string
    type: object
  cases.UpdateRequest:
    properties:
      case_type:
        type: string
      code:
        description: 'Code, CaseType and KBID are rejected: they never change.'
        type: string
      kb_id:
        type: string
      metadata:
        additionalProperties: {}
        type: object
      status:
        type: string
      title:
        type: string
    type: object
  document.Accepted:
    properties:
      callback_url:
        description: CallbackURL echoes the completion callback, when one was given.
        type: string
      document_id:
        type: string
      duplicate:
        type: boolean
      file_name:
        type: string
      metadata:
        additionalProperties: {}
        type: object
      status:
        type: string
    type: object
  document.DocumentDetail:
    properties:
      batch_id:
        type: string
      callback_url:
        description: |-
          CallbackURL, when set, receives a POST once the document reaches a
          terminal status (§4.7).
        type: string
      case_code:
        type: string
      case_id:
        type: string
      created_at:
        type: string
      created_by:
        type: string
      engine:
        type: string
      error:
        type: string
      failed_pages:
        items:
          $ref: '#/definitions/document.FailedPage'
        type: array
      file_name:
        type: string
      gen:
        type: integer
      id:
        type: string
      index_status:
        type: string
      kb_id:
        type: string
      metadata:
        additionalProperties: {}
        type: object
      mime_type:
        type: string
      page_count:
        type: integer
      pages_done:
        type: integer
      pages_failed:
        type: integer
      pages_text_layer:
        type: integer
      parse_status:
        type: string
      pdf_info:
        additionalProperties: {}
        type: object
      pdfa_conformance:
        type: string
      pdfa_part:
        type: integer
      progress:
        type: number
      size_bytes:
        type: integer
      spans:
        items:
          $ref: '#/definitions/postgres.Span'
        type: array
      status:
        type: string
      summary:
        type: string
      title:
        type: string
      updated_at:
        type: string
      wiki_status:
        type: string
    type: object
  document.FailedPage:
    properties:
      error:
        type: string
      page_no:
        type: integer
    type: object
  document.LocateRequest:
    properties:
      fuzzy:
        type: boolean
      line:
        type: integer
      md_end:
        type: integer
      md_start:
        type: integer
      page:
        type: integer
      text:
        type: string
    type: object
  document.Location:
    properties:
      bbox:
        $ref: '#/definitions/types.BBox'
      bbox_pt:
        allOf:
        - $ref: '#/definitions/types.BBox'
        description: BBoxPt is the box in PDF points (origin top-left of the page).
      block_no:
        type: integer
      line_no:
        type: integer
      page_no:
        type: integer
      quad:
        items:
          items:
            format: float64
            type: number
          type: array
        type: array
      score:
        type: number
      text:
        type: string
    type: object
  document.PageView:
    properties:
      attempts:
        type: integer
      blocks:
        items:
          $ref: '#/definitions/postgres.PageBlock'
        type: array
      doc_md_offset:
        type: integer
      document_id:
        type: string
      dpi:
        type: number
      engine:
        type: string
      error:
        type: string
      finished_at:
        type: string
      gen:
        type: integer
      height:
        type: integer
      height_pt:
        type: number
      is_blank:
        type: boolean
      lines:
        items:
          $ref: '#/definitions/postgres.PageLine'
        type: array
      markdown:
        type: string
      ocr_ms:
        type: integer
      page_no:
        type: integer
      render_ms:
        type: integer
      rotation:
        type: integer
      started_at:
        type: string
      status:
        type: string
      text_plain:
        type: string
      text_quality:
        type: number
      text_source:
        type: string
      width:
        type: integer
      width_pt:
        type: number
    type: object
  document.Rejected:
    properties:
      errors:
        items:
          type: string
        type: array
      file_name:
        type: string
      index:
        type: integer
    type: object
  document.ReparseRequest:
    properties:
      callback_url:
        description: |-
          CallbackURL replaces the document's completion callback URL; empty
          keeps the current one. The callback fires again when the reparse ends.
        type: string
      engine:
        type: string
      pages:
        items:
          type: integer
        type: array
    type: object
  document.UploadCase:
    properties:
      case_type:
        type: string
      code:
        type: string
      created:
        type: boolean
      id:
        type: string
    type: object
  document.UploadResult:
    properties:
      batch_id:
        type: string
      case:
        $ref: '#/definitions/document.UploadCase'
      documents:
        items:
          $ref: '#/definitions/document.Accepted'
        type: array
      rejected:
        items:
          $ref: '#/definitions/document.Rejected'
        type: array
    type: object
  dto.AGUIContextItem:
    properties:
      description:
        type: string
      value:
        type: string
    type: object
  dto.AGUIMessage:
    properties:
      content:
        type: string
      id:
        type: string
      name:
        type: string
      role:
        description: user | assistant | tool | system | developer
        type: string
      toolCallId:
        type: string
    type: object
  dto.AGUIRunAgentInput:
    properties:
      context:
        items:
          $ref: '#/definitions/dto.AGUIContextItem'
        type: array
      forwardedProps:
        type: object
      messages:
        items:
          $ref: '#/definitions/dto.AGUIMessage'
        type: array
      metadata:
        allOf:
        - $ref: '#/definitions/dto.Metadata'
        description: |-
          Metadata (bepaylot extension) binds the thread's session to a case with
          case_id or case {kb_id, code}; forwardedProps may carry the same fields.
      runId:
        type: string
      state:
        type: object
      threadId:
        type: string
      tools:
        items:
          $ref: '#/definitions/dto.AGUIToolDefinition'
        type: array
    type: object
  dto.AGUIToolDefinition:
    properties:
      description:
        type: string
      name:
        type: string
      parameters:
        type: object
    type: object
  dto.BulkMetadataRequest:
    properties:
      filter:
        properties:
          batch_id:
            type: string
          case_id:
            type: string
          document_ids:
            items:
              type: string
            type: array
          metadata:
            $ref: '#/definitions/types.MetadataFilter'
        type: object
      set:
        additionalProperties: {}
        type: object
      unset:
        items:
          type: string
        type: array
    type: object
  dto.BulkMetadataResponse:
    properties:
      updated:
        type: integer
    type: object
  dto.CallbackList:
    properties:
      data:
        items:
          $ref: '#/definitions/types.DocumentCallback'
        type: array
    type: object
  dto.CaseConflict:
    properties:
      case:
        $ref: '#/definitions/types.Case'
