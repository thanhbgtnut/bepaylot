basePath: /
definitions:
  cases.CreateRequest:
    properties:
      case_type:
        type: string
      code:
        type: string
      metadata:
        additionalProperties: {}
        type: object
      title:
        type: string
    type: object
  cases.UpdateRequest:
    properties:
      case_type:
        type: string
      code:
        description: 'Code, CaseType and KBID are rejected: they never change.'
        type: string
      kb_id:
        type: string
      metadata:
        additionalProperties: {}
        type: object
      status:
        type: string
      title:
        type: string
    type: object
  docmodel.SplitFile:
    properties:
      classify_status:
        type: string
      document_id:
        type: string
      file_name:
        type: string
      indexed:
        type: boolean
      marks:
        additionalProperties:
          type: string
        type: object
      page_count:
        type: integer
      segments:
        items:
          $ref: '#/definitions/types.Segment'
        type: array
      status:
        description: none | proposed | reviewed
        type: string
    type: object
  docmodel.SplitInput:
    properties:
      bundles:
        items:
          properties:
            segments:
              items:
                properties:
                  document_id:
                    type: string
                  label:
                    type: string
                  page_end:
                    type: integer
                  page_start:
                    type: integer
                type: object
              type: array
          type: object
        type: array
    type: object
  docmodel.SplitView:
    properties:
      bundles:
        items:
          type: string
        type: array
      files:
        items:
          $ref: '#/definitions/docmodel.SplitFile'
        type: array
      labels:
        items:
          $ref: '#/definitions/types.ClassLabel'
        type: array
      opens_with:
        items:
          type: string
        type: array
      reviewed:
        description: every indexed file is reviewed
        type: boolean
    type: object
  document.Accepted:
    properties:
      callback_url:
        description: CallbackURL echoes the completion callback, when one was given.
        type: string
      document_id:
        type: string
      duplicate:
        type: boolean
      file_name:
        type: string
      metadata:
        additionalProperties: {}
        type: object
      status:
        type: string
    type: object
  document.DocumentDetail:
    properties:
      batch_id:
        type: string
      callback_url:
        description: |-
          CallbackURL, when set, receives a POST once the document reaches a
          terminal status (§4.7).
        type: string
      case_code:
        type: string
      case_id:
        type: string
      created_at:
        type: string
      created_by:
        type: string
      engine:
        type: string
      error:
        type: string
      failed_pages:
        items:
          $ref: '#/definitions/document.FailedPage'
        type: array
      file_name:
        type: string
      gen:
        type: integer
      id:
        type: string
      index_status:
        type: string
      kb_id:
        type: string
      metadata:
        additionalProperties: {}
        type: object
      mime_type:
        type: string
      page_count:
        type: integer
      pages_done:
        type: integer
      pages_failed:
        type: integer
      pages_text_layer:
        type: integer
      parse_status:
        type: string
      pdf_info:
        additionalProperties: {}
        type: object
      pdfa_conformance:
        type: string
      pdfa_part:
        type: integer
      progress:
        type: number
      size_bytes:
        type: integer
      spans:
        items:
          $ref: '#/definitions/postgres.Span'
        type: array
      status:
        type: string
      summary:
        type: string
      title:
        type: string
      updated_at:
        type: string
    type: object
  document.FailedPage:
    properties:
      error:
        type: string
      page_no:
        type: integer
    type: object
  document.LocateRequest:
    properties:
      fuzzy:
        type: boolean
      line:
        type: integer
      md_end:
        type: integer
      md_start:
        type: integer
      page:
        type: integer
      text:
        type: string
    type: object
  document.Location:
    properties:
      bbox:
        $ref: '#/definitions/types.BBox'
      bbox_pt:
        allOf:
        - $ref: '#/definitions/types.BBox'
        description: BBoxPt is the box in PDF points (origin top-left of the page).
      block_no:
        type: integer
      line_no:
        type: integer
      page_no:
        type: integer
      quad:
        items:
          items:
            format: float64
            type: number
          type: array
        type: array
      score:
        type: number
      text:
        type: string
    type: object
  document.PageView:
    properties:
      attempts:
        type: integer
      blocks:
        items:
          $ref: '#/definitions/postgres.PageBlock'
        type: array
      doc_md_offset:
        type: integer
      document_id:
        type: string
      dpi:
        type: number
      engine:
        type: string
      error:
        type: string
      finished_at:
        type: string
      gen:
        type: integer
      height:
        type: integer
      height_pt:
        type: number
      is_blank:
        type: boolean
      lines:
        items:
          $ref: '#/definitions/postgres.PageLine'
        type: array
      markdown:
        type: string
      ocr_ms:
        type: integer
      page_no:
        type: integer
      render_ms:
        type: integer
      rotation:
        type: integer
      started_at:
        type: string
      status:
        type: string
      text_plain:
        type: string
      text_quality:
        type: number
      text_source:
        type: string
      width:
        type: integer
      width_pt:
        type: number
    type: object
  document.Rejected:
    properties:
      errors:
        items:
          type: string
        type: array
      file_name:
        type: string
      index:
        type: integer
    type: object
  document.ReparseRequest:
    properties:
      callback_url:
        description: |-
          CallbackURL replaces the document's completion callback URL; empty
          keeps the current one. The callback fires again when the reparse ends.
        type: string
      engine:
        type: string
      pages:
        items:
          type: integer
        type: array
    type: object
  document.UploadCase:
    properties:
      case_type:
        type: string
      code:
        type: string
      created:
        type: boolean
      id:
        type: string
    type: object
  document.UploadResult:
    properties:
      batch_id:
        type: string
      case:
        $ref: '#/definitions/document.UploadCase'
      documents:
        items:
          $ref: '#/definitions/document.Accepted'
        type: array
      rejected:
        items:
          $ref: '#/definitions/document.Rejected'
        type: array
    type: object
  dto.AGUIContextItem:
    properties:
      description:
        type: string
      value:
        type: string
    type: object
  dto.AGUIMessage:
    properties:
      content:
        type: string
      id:
        type: string
      name:
        type: string
      role:
        description: user | assistant | tool | system | developer
        type: string
      toolCallId:
        type: string
    type: object
  dto.AGUIRunAgentInput:
    properties:
      context:
        items:
          $ref: '#/definitions/dto.AGUIContextItem'
        type: array
      forwardedProps:
        type: object
      messages:
        items:
          $ref: '#/definitions/dto.AGUIMessage'
        type: array
      metadata:
        allOf:
        - $ref: '#/definitions/dto.Metadata'
        description: |-
          Metadata (bepaylot extension) binds the thread's session to a case with
          case_id or case {kb_id, code}; forwardedProps may carry the same fields.
      runId:
        type: string
      state:
        type: object
      threadId:
        type: string
      tools:
        items:
          $ref: '#/definitions/dto.AGUIToolDefinition'
        type: array
    type: object
  dto.AGUIToolDefinition:
    properties:
      description:
        type: string
      name:
        type: string
      parameters:
        type: object
    type: object
  dto.APIKeyList:
    properties:
      data:
        items:
          $ref: '#/definitions/dto.APIKeyView'
        type: array
    type: object
  dto.APIKeyView:
    properties:
      created_at:
        type: string
      id:
        type: string
      issued_by:
        type: string
      last_used_at:
        type: string
      name:
        type: string
      prefix:
        type: string
      revoked_at:
        type: string
    type: object
  dto.AdminUpdateUserRequest:
    properties:
      is_active:
        type: boolean
      monthly_limit:
        example: 500000
        type: number
      role:
        example: prompt_editor
        type: string
    type: object
  dto.AdminUser:
    properties:
      auth_provider:
        example: local
        type: string
      created_at:
        type: string
      email:
        type: string
      has_password:
        type: boolean
      id:
        type: string
      is_active:
        type: boolean
      is_admin:
        type: boolean
      keys:
        type: integer
      last_login_at:
        type: string
      monthly_limit:
        type: number
      name:
        type: string
      role:
        description: Role is admin, prompt_editor or user (§8.4); admin also for http.admin_emails.
        example: user
        type: string
      spent:
        type: number
    type: object
  dto.AdminUserList:
    properties:
      currency:
        example: VND
        type: string
      data:
        items:
          $ref: '#/definitions/dto.AdminUser'
        type: array
    type: object
  dto.AuthConfig:
    properties:
      auth_bypass:
        description: |-
          AuthBypass: the server runs with http.auth_bypass (dev only); the UI
          skips the login page.
        type: boolean
      oidc:
        $ref: '#/definitions/dto.AuthOIDCConfig'
      password_min_length:
        type: integer
      registration_enabled:
        type: boolean
    type: object
  dto.AuthOIDCConfig:
    properties:
      display_name:
        type: string
      enabled:
        type: boolean
    type: object
  dto.AuthTokens:
    properties:
      access_token:
        type: string
      expires_at:
        type: string
      is_new_user:
        type: boolean
      refresh_token:
        type: string
      token_type:
        example: Bearer
        type: string
      user:
        $ref: '#/definitions/dto.UserView'
    type: object
  dto.BulkMetadataRequest:
    properties:
      filter:
        properties:
          batch_id:
            type: string
          case_id:
            type: string
          document_ids:
            items:
              type: string
            type: array
          metadata:
            $ref: '#/definitions/types.MetadataFilter'
        type: object
      set:
        additionalProperties: {}
        type: object
      unset:
        items:
          type: string
        type: array
    type: object
  dto.BulkMetadataResponse:
    properties:
      updated:
        type: integer
    type: object
  dto.CallbackList:
    properties:
      data:
        items:
          $ref: '#/definitions/types.DocumentCallback'
        type: array
    type: object
  dto.CaseConflict:
    properties:
      case:
        $ref: '#/definitions/types.Case'
      error:
        properties:
          message:
            type: string
          type:
            type: string
        type: object
      type:
        description: '"error"'
        type: string
    type: object
  dto.CaseList:
    properties:
      data:
        items:
          $ref: '#/definitions/types.Case'
        type: array
      next_cursor:
        type: string
    type: object
  dto.CaseRef:
    properties:
      code:
        type: string
      kb_id:
        type: string
    type: object
  dto.CaseTypeList:
    properties:
      data:
        items:
          $ref: '#/definitions/types.CaseType'
        type: array
    type: object
  dto.ChangePasswordRequest:
    properties:
      current_password:
        description: |-
          CurrentPassword may be empty for accounts without a local password
          (created through OIDC or cmd/seed).
        type: string
      new_password:
        type: string
    type: object
  dto.ClassifyCaseRequest:
    properties:
      document_ids:
        items:
          type: string
        type: array
      mode:
        description: titles | pages
        example: titles
        type: string
    type: object
  dto.ClassifyCaseResponse:
    properties:
      queued:
        type: integer
    type: object
  dto.CorrectionStats:
    properties:
      data:
        items:
          $ref: '#/definitions/types.CorrectionStat'
        type: array
    type: object
  dto.CreateAPIKeyRequest:
    properties:
      name:
        example: curl
        type: string
    type: object
  dto.CreateKBRequest:
    properties:
      config:
        $ref: '#/definitions/types.KBConfig'
      description:
        type: string
      metadata_schema:
        $ref: '#/definitions/types.MetadataSchema'
      name:
        type: string
    type: object
  dto.CreateSessionRequest:
    properties:
      case:
        allOf:
        - $ref: '#/definitions/dto.CaseRef'
        description: Case names the case by knowledge base and code instead of CaseID.
      case_id:
        description: CaseID binds the new session to a case for its whole life (§8.1).
        type: string
      metadata:
        additionalProperties: {}
        type: object
      model:
        type: string
      provider:
        type: string
      system:
        type: string
      template_id:
        description: TemplateID is a published chat template (§8.4).
        type: string
      title:
        type: string
    type: object
  dto.CreateSheetRequest:
    properties:
      tables:
        description: Tables are the labels of the sub-tables to build; omitted = all.
        example:
        - hop_dong
        - hoa_don
        items:
          type: string
        type: array
      template_id:
        format: uuid
        type: string
    type: object
  dto.CreatedAPIKey:
    properties:
      api_key:
        example: sk-bepaylot-…
        type: string
      key:
        $ref: '#/definitions/dto.APIKeyView'
    type: object
  dto.DeadLetter:
    properties:
      fail_count:
        type: integer
      failed_at:
        type: string
      id:
        type: integer
      last_error:
        type: string
      payload:
        type: object
      queue:
        type: string
      scope:
        type: string
      scope_id:
        type: string
      task_type:
        type: string
    type: object
  dto.DeadLetterList:
    properties:
      data:
        items:
          $ref: '#/definitions/dto.DeadLetter'
        type: array
    type: object
  dto.DeleteResponse:
    properties:
      deleted:
        type: boolean
      id:
        type: string
    type: object
  dto.DocumentList:
    properties:
      data:
        items:
          $ref: '#/definitions/types.Document'
        type: array
      next_cursor:
        type: string
    type: object
  dto.DocumentSearchRequest:
    properties:
      mode:
        description: keyword (default) | reasoning
        type: string
      page_from:
        type: integer
      page_to:
        type: integer
      query:
        type: string
    type: object
  dto.DocumentSearchResponse:
    properties:
      pages:
        items:
          $ref: '#/definitions/types.PageSearchHit'
        type: array
    type: object
  dto.EngineInfo:
    properties:
      available:
        type: boolean
      default:
        type: boolean
      error:
        type: string
      name:
        type: string
    type: object
  dto.EngineList:
    properties:
      data:
        items:
          $ref: '#/definitions/dto.EngineInfo'
        type: array
    type: object
  dto.ErrorResponse:
    properties:
      error:
        properties:
          message:
            type: string
          type:
            type: string
        type: object
      type:
        description: '"error"'
        type: string
    type: object
  dto.HealthResponse:
    properties:
      status:
        example: ok
        type: string
    type: object
  dto.InputMessage:
    properties:
      content:
        description: string, or an array of content blocks
        type: object
      role:
        type: string
    type: object
  dto.KBList:
    properties:
      data:
        items:
          $ref: '#/definitions/types.KnowledgeBase'
        type: array
    type: object
  dto.LLMKeyView:
    properties:
      base_url:
        type: string
      kind:
        type: string
      masked_key:
        type: string
      models:
        items:
          type: string
        type: array
      overridden:
        type: boolean
      provider:
        type: string
    type: object
  dto.LocationsResponse:
    properties:
      hits:
        items:
          $ref: '#/definitions/types.SearchHit'
        type: array
    type: object
  dto.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    type: object
  dto.LogoutRequest:
    properties:
      refresh_token:
        type: string
    type: object
  dto.MCPServerListResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/dto.MCPServerView'
        type: array
    type: object
  dto.MCPServerRequest:
    properties:
      args:
        items:
          type: string
        type: array
      command:
        description: stdio
        type: string
      env:
        additionalProperties:
          type: string
        type: object
      headers:
        additionalProperties:
          type: string
        type: object
      name:
        type: string
      tool_allowlist:
        items:
          type: string
        type: array
      transport:
        description: stdio | sse | streamable_http
        type: string
      url:
        description: sse | streamable_http
        type: string
    type: object
  dto.MCPServerView:
    properties:
      connected_at:
        type: string
      name:
        type: string
      source:
        description: file | api
        type: string
      tools:
        items:
          type: string
        type: array
      transport:
        type: string
    type: object
  dto.MarkdownResponse:
    properties:
      markdown:
        type: string
    type: object
  dto.MessageListResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/dto.TranscriptMessage'
        type: array
    type: object
  dto.MessageResponse:
    properties:
      content:
        items:
          $ref: '#/definitions/dto.OutputBlock'
        type: array
      id:
        type: string
      model:
        type: string
      role:
        description: '"assistant"'
        type: string
      session:
        allOf:
        - $ref: '#/definitions/dto.SessionBrief'
        description: bepaylot extension
      stop_reason:
        type: string
      stop_sequence:
        type: string
      type:
        description: '"message"'
        type: string
      usage:
        $ref: '#/definitions/dto.Usage'
    type: object
  dto.MessagesRequest:
    properties:
      history_token_budget:
        description: |-
          HistoryTokenBudget (bepaylot extension) caps the approximate number of
          tokens of conversation history sent to the model this turn. Oldest
          messages are dropped first; the latest user message is always kept, even
          if it alone exceeds the budget. 0 or omitted uses the server default
          (agent.history_token_budget); a negative value is rejected.
        example: 24000
        type: integer
      max_tokens:
        type: integer
      messages:
        items:
          $ref: '#/definitions/dto.InputMessage'
        type: array
      metadata:
        $ref: '#/definitions/dto.Metadata'
      model:
        type: string
      provider:
        description: bepaylot extension
        type: string
      stream:
        type: boolean
      system:
        description: string, or [{"type":"text","text":"..."}]
        type: object
      temperature:
        type: number
    type: object
  dto.Metadata:
    properties:
      case:
        allOf:
        - $ref: '#/definitions/dto.CaseRef'
        description: Case names the case by KB and code instead of CaseID.
      case_id:
        description: |-
          CaseID binds the session to one case (§8.1): the kb_* tools
          then see that case only. Binding is permanent: another case is 409.
        type: string
      session_id:
        description: bepaylot extension
        type: string
      user_id:
        type: string
    type: object
  dto.MetadataSchemaBody:
    properties:
      schema:
        $ref: '#/definitions/types.MetadataSchema'
    type: object
  dto.MetadataUpdateRequest:
    properties:
      metadata:
        additionalProperties: {}
        type: object
      mode:
        description: Mode is merge (default; null values delete keys) or replace.
        type: string
    type: object
  dto.MetadataValue:
    properties:
      count:
        type: integer
      value:
        type: string
    type: object
  dto.MetadataValuesResponse:
    properties:
      key:
        type: string
      values:
        items:
          $ref: '#/definitions/dto.MetadataValue'
        type: array
    type: object
  dto.OK:
    properties:
      ok:
        type: boolean
    type: object
  dto.OKResponse:
    properties:
      success:
        type: boolean
    type: object
  dto.OutputBlock:
    properties:
      content: {}
      id:
        type: string
      input:
        additionalProperties: {}
        type: object
      is_error:
        type: boolean
      name:
        type: string
      text:
        type: string
      thinking:
        type: string
      tool_use_id:
        type: string
      type:
        description: text | tool_use | tool_result | thinking
        type: string
    type: object
  dto.PagesResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/types.DocumentPage'
        type: array
    type: object
  dto.PublishTemplateRequest:
    properties:
      version:
        example: 2
        type: integer
    type: object
  dto.QueueStat:
    properties:
      active:
        type: integer
      archived:
        type: integer
      error:
        type: string
      name:
        type: string
      pending:
        type: integer
      pool:
        type: string
      retry:
        type: integer
      scheduled:
        type: integer
      size:
        type: integer
      weight:
        type: integer
    type: object
  dto.QueueStats:
    properties:
      data:
        items:
          $ref: '#/definitions/dto.QueueStat'
        type: array
    type: object
  dto.ReadyResponse:
    properties:
      default_model:
        type: string
      default_provider:
        type: string
      error:
        type: string
      providers:
        items:
          type: string
        type: array
      status:
        example: ready
        type: string
    type: object
  dto.RefreshRequest:
    properties:
      refresh_token:
        type: string
    type: object
  dto.RegisterRequest:
    properties:
      email:
        example: an.nguyen@example.com
        type: string
      name:
        example: Nguyễn An
        type: string
      password:
        example: correct horse battery
        type: string
    type: object
  dto.RetryCallbackRequest:
    properties:
      callback_id:
        description: CallbackID selects a delivery; empty retries the latest one.
        type: string
    type: object
  dto.SessionBrief:
    properties:
      case_id:
        type: string
      created_at:
        type: string
      id:
        type: string
      metadata:
        additionalProperties: {}
        type: object
      model:
        type: string
      provider:
        type: string
      summary:
        type: string
      template_id:
        type: string
      title:
        type: string
      updated_at:
        type: string
    type: object
  dto.SessionDetail:
    properties:
      case_id:
        type: string
      created_at:
        type: string
      id:
        type: string
      messages:
        items:
          $ref: '#/definitions/dto.TranscriptMessage'
        type: array
      metadata:
        additionalProperties: {}
        type: object
      model:
        type: string
      provider:
        type: string
      summary:
        type: string
      template_id:
        type: string
      title:
        type: string
      updated_at:
