  /v1/cases/{id}/sheets:
    get:
      parameters:
      - description: Case id
        format: uuid
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.SheetList'
      security:
      - ApiKeyAuth: []
      summary: The sheets of a case, newest first
      tags:
      - Sheets
    post:
      consumes:
      - application/json
      description: One sub-table per document type (tables = labels, omitted = all);
        rows are the reviewed documents of the case. Confirmed fields are reused;
        the missing ones are extracted by one agent turn per bundle (task case:sheet).
        Poll GET /v1/sheets/{id} for progress. 409 split_not_reviewed when a file's
        split is not reviewed.
      parameters:
      - description: Case id
        format: uuid
        in: path
        name: id
        required: true
        type: string
      - description: Template
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.CreateSheetRequest'
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/types.Sheet'
        "402":
          description: Payment Required
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Build a sheet of a case from a sheet template (§6.9.6)
      tags:
      - Sheets
  /v1/cases/{id}/split:
    get:
      parameters:
      - description: Case id
        format: uuid
        in: path
        name: id
        required: true
