      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.OK'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Cancel processing (finished pages are kept)
      tags:
      - Documents
  /v1/documents/{id}/events:
    get:
      description: Emits a "status" event whenever status, stage or page counters
        change, and ends when the document reaches a terminal state.
      parameters:
