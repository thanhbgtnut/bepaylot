  dto.MessagesRequest:
    properties:
      history_token_budget:
        description: |-
          HistoryTokenBudget (bepaylot extension) caps the approximate number of
          tokens of conversation history sent to the model this turn. Oldest
          messages are dropped first; the latest user message is always kept, even
          if it alone exceeds the budget. 0 or omitted uses the server default
          (agent.history_token_budget); a negative value is rejected.
        example: 24000
        type: integer
      max_tokens:
        type: integer
      messages:
        items:
          $ref: '#/definitions/dto.InputMessage'
        type: array
      metadata:
        $ref: '#/definitions/dto.Metadata'
      model:
        type: string
      provider:
        description: bepaylot extension
        type: string
      stream:
        type: boolean
      system:
        description: string, or [{"type":"text","text":"..."}]
        type: object
      temperature:
        type: number
    type: object
