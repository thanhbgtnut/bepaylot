      data:
        items:
          $ref: '#/definitions/dto.MCPServerView'
        type: array
    type: object
  dto.MCPServerRequest:
    properties:
      args:
        items:
          type: string
        type: array
      command:
        description: stdio
        type: string
      env:
        additionalProperties:
          type: string
        type: object
      headers:
        additionalProperties:
          type: string
        type: object
      name:
        type: string
      tool_allowlist:
        items:
          type: string
        type: array
      transport:
        description: stdio | sse | streamable_http
        type: string
      url:
        description: sse | streamable_http
        type: string
    type: object
  dto.MCPServerView:
    properties:
      connected_at:
        type: string
      name:
        type: string
      source:
        description: file | api
        type: string
      tools:
        items:
          type: string
        type: array
      transport:
        type: string
    type: object
  dto.MarkdownResponse:
    properties:
      markdown:
        type: string
    type: object
  dto.MessageListResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/dto.TranscriptMessage'
        type: array
    type: object
  dto.MessageResponse:
    properties:
      content:
        items:
          $ref: '#/definitions/dto.OutputBlock'
        type: array
      id:
        type: string
      model:
        type: string
      role:
        description: '"assistant"'
        type: string
      session:
        allOf:
        - $ref: '#/definitions/dto.SessionBrief'
        description: bepaylot extension
      stop_reason:
        type: string
      stop_sequence:
        type: string
      type:
        description: '"message"'
        type: string
      usage:
        $ref: '#/definitions/dto.Usage'
    type: object
  dto.MessagesRequest:
    properties:
      history_token_budget:
        description: |-
          HistoryTokenBudget (bepaylot extension) caps the approximate number of
          tokens of conversation history sent to the model this turn. Oldest
          messages are dropped first; the latest user message is always kept, even
          if it alone exceeds the budget. 0 or omitted uses the server default
          (agent.history_token_budget); a negative value is rejected.
        example: 24000
        type: integer
      max_tokens:
        type: integer
      messages:
        items:
          $ref: '#/definitions/dto.InputMessage'
        type: array
      metadata:
        $ref: '#/definitions/dto.Metadata'
      model:
        type: string
      provider:
        description: bepaylot extension
        type: string
      stream:
        type: boolean
      system:
        description: string, or [{"type":"text","text":"..."}]
        type: object
      temperature:
        type: number
    type: object
  dto.Metadata:
    properties:
      case:
        allOf:
        - $ref: '#/definitions/dto.CaseRef'
        description: Case names the case by KB and code instead of CaseID.
      case_id:
        description: |-
          CaseID binds the session to one case (§8.1): the wiki_* and kb_* tools
          then see that case only. Binding is permanent: another case is 409.
        type: string
      session_id:
        description: bepaylot extension
        type: string
      user_id:
        type: string
    type: object
  dto.MetadataSchemaBody:
    properties:
      schema:
        $ref: '#/definitions/types.MetadataSchema'
    type: object
  dto.MetadataUpdateRequest:
