    get:
      description: Returns content, attributes, footnotes (n → citation_id, quote,
        file, page, status), links in and out and the ingest proposal if any. The
        slug contains "/", e.g. nguon/hop-dong-15-2026. A slug of another case is
        404.
      parameters:
