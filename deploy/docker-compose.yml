services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: bepaylot-postgres
    environment:
      POSTGRES_USER: bepaylot
      POSTGRES_PASSWORD: bepaylot
      POSTGRES_DB: bepaylot
    ports:
      - "${BEPAYLOT_PG_PORT:-5433}:5432"
    volumes:
      - bepaylot_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bepaylot -d bepaylot"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Broker for the asynq task queue (§4).
  redis:
    image: redis:7.4-alpine
    container_name: bepaylot-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${BEPAYLOT_REDIS_PORT:-6380}:6379"
    volumes:
      - bepaylot_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  # S3-compatible object storage for files and page images (§9.1).
  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: bepaylot-minio
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: bepaylot
      MINIO_ROOT_PASSWORD: bepaylot-secret
    ports:
      - "${BEPAYLOT_MINIO_PORT:-9110}:9000"
      - "${BEPAYLOT_MINIO_CONSOLE_PORT:-9111}:9001"
    volumes:
      - bepaylot_minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  bepaylot_pgdata:
  bepaylot_redis:
  bepaylot_minio:
